name: OpenCodeGoIOS
options:
  bundleIdPrefix: com.steve233.opencodego
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_LANGUAGE: zh-Hans
    CURRENT_PROJECT_VERSION: "3"
    MARKETING_VERSION: "1.0.2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES
  configs:
    Debug:
      APP_GROUP_ID: group.com.steve233.opencodego.ios
    Release:
      APP_GROUP_ID: group.3e514c57016aaf19.1

targets:
  OpenCodeGoIOS:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: App
      - path: Shared/IOSTheme.swift
      - path: ../Sources/PlatformConfig.swift
      - path: ../Sources/BillingCycle.swift
      - path: ../Sources/ChartFormatters.swift
      - path: ../Sources/ChartWindow.swift
      - path: ../Sources/ConsoleUsageAPI.swift
      - path: ../Sources/CostCrawler.swift
      - path: ../Sources/GoQuotaChart.swift
      - path: ../Sources/GoQuotaRegistry.swift
      - path: ../Sources/KeyDirectory.swift
      - path: ../Sources/ModelPalette.swift
      - path: ../Sources/ModelRegistry.swift
      - path: ../Sources/NetworkManager.swift
      - path: ../Sources/OpenCodeKeyFetcher.swift
      - path: ../Sources/UsageCostModels.swift
      - path: ../Sources/UsageMerge.swift
      - path: ../Sources/UsageModels.swift
      - path: ../Sources/UsagePipeline.swift
      - path: ../Sources/UsageRows.swift
      - path: ../Sources/Versioning.swift
      - path: ../Sources/WidgetDataStore.swift
      - path: ../Sources/WidgetTimeline.swift
      - path: ../Sources/Views/ChartViews.swift
      - path: ../Sources/Views/QuotaViews.swift
      - path: Resources/AppIcons
        buildPhase: resources
      - path: ../Resources/BrandLight.png
        buildPhase: resources
      - path: ../Resources/BrandDark.png
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.steve233.opencodego.ios
        PRODUCT_NAME: OpenCode Go
        PRODUCT_MODULE_NAME: OpenCodeGoIOS
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0.2"
        CURRENT_PROJECT_VERSION: "3"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/OpenCodeGoIOS.entitlements
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - target: OpenCodeGoWidgetIOSExtension
      - sdk: WidgetKit.framework
      - sdk: BackgroundTasks.framework
      - sdk: Charts.framework

  OpenCodeGoWidgetIOSExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Widget
      - path: Shared/IOSTheme.swift
      - path: App/IOSSessionStore.swift
      - path: ../Sources/PlatformConfig.swift
      - path: ../Sources/BillingCycle.swift
      - path: ../Sources/ChartFormatters.swift
      - path: ../Sources/ChartWindow.swift
      - path: ../Sources/ConsoleUsageAPI.swift
      - path: ../Sources/CostCrawler.swift
      - path: ../Sources/GoQuotaRegistry.swift
      - path: ../Sources/KeyDirectory.swift
      - path: ../Sources/ModelPalette.swift
      - path: ../Sources/ModelRegistry.swift
      - path: ../Sources/NetworkManager.swift
      - path: ../Sources/UsageCostModels.swift
      - path: ../Sources/UsageMerge.swift
      - path: ../Sources/UsageModels.swift
      - path: ../Sources/UsagePipeline.swift
      - path: ../Sources/UsageRows.swift
      - path: ../Sources/WidgetDataStore.swift
      - path: ../Sources/WidgetTimeline.swift
      - path: ../Resources/BrandLight.png
        buildPhase: resources
      - path: ../Resources/BrandDark.png
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.steve233.opencodego.ios.widget
        PRODUCT_NAME: OpenCodeGoWidgetIOSExtension
        PRODUCT_MODULE_NAME: OpenCodeGoWidgetIOSExtension
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0.2"
        CURRENT_PROJECT_VERSION: "3"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/OpenCodeGoWidgetIOS.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

  OpenCodeGoIOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests
    dependencies:
      - target: OpenCodeGoIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.steve233.opencodego.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/OpenCode Go.app/OpenCode Go"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  OpenCodeGoIOS:
    build:
      targets:
        OpenCodeGoIOS: all
        OpenCodeGoWidgetIOSExtension: all
        OpenCodeGoIOSTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OpenCodeGoIOSTests
    archive:
      config: Release
